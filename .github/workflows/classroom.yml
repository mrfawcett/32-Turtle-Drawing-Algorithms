name: Autograding Tests
'on':
  - push
  - workflow_dispatch
  - repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: "drawPolygon (the 360.0 / sides rule) (25)"
        id: drawpolygon
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "drawPolygon (the 360.0 / sides rule)"
          setup-command: ''
          command: sh .github/grade.sh DrawPolygonTest
          timeout: 5
          max-score: 25
      - name: "drawStar (10)"
        id: drawstar
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "drawStar"
          setup-command: ''
          command: sh .github/grade.sh DrawStarTest
          timeout: 5
          max-score: 10
      - name: "drawSpiral (15)"
        id: drawspiral
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "drawSpiral"
          setup-command: ''
          command: sh .github/grade.sh DrawSpiralTest
          timeout: 5
          max-score: 15
      - name: "drawFlower (nested loops) (25)"
        id: drawflower
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "drawFlower (nested loops)"
          setup-command: ''
          command: sh .github/grade.sh DrawFlowerTest
          timeout: 5
          max-score: 25
      - name: "drawGrid (15)"
        id: drawgrid
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "drawGrid"
          setup-command: ''
          command: sh .github/grade.sh DrawGridTest
          timeout: 5
          max-score: 15
      - name: "drawConcentricSquares (10)"
        id: drawconcentricsquares
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "drawConcentricSquares"
          setup-command: ''
          command: sh .github/grade.sh DrawConcentricSquaresTest
          timeout: 5
          max-score: 10
      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          DRAWPOLYGON_RESULTS: "${{ steps.drawpolygon.outputs.result }}"
          DRAWSTAR_RESULTS: "${{ steps.drawstar.outputs.result }}"
          DRAWSPIRAL_RESULTS: "${{ steps.drawspiral.outputs.result }}"
          DRAWFLOWER_RESULTS: "${{ steps.drawflower.outputs.result }}"
          DRAWGRID_RESULTS: "${{ steps.drawgrid.outputs.result }}"
          DRAWCONCENTRICSQUARES_RESULTS: "${{ steps.drawconcentricsquares.outputs.result }}"
        with:
          runners: drawpolygon,drawstar,drawspiral,drawflower,drawgrid,drawconcentricsquares
